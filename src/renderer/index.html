<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; worker-src 'self' blob:; font-src 'self' data:">
  <title>Redline PDF Editor</title>
  <link rel="stylesheet" href="../../node_modules/pdfjs-dist/web/pdf_viewer.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header id="toolbar">
    <div class="group">
      <button id="btn-open" title="Open PDF (⌘O)">Open</button>
      <button id="btn-save" title="Save (⌘S)" data-needs-doc>Save</button>
      <button id="btn-sidebar" class="icon" title="Toggle thumbnails (⌘T)" aria-pressed="true">▤</button>
    </div>

    <div class="group" data-needs-doc>
      <button id="btn-undo" class="icon" title="Undo (⌘Z)">↶</button>
      <button id="btn-redo" class="icon" title="Redo (⇧⌘Z)">↷</button>
    </div>

    <div class="group tools" id="tool-buttons" data-needs-doc></div>

    <div class="group" data-needs-doc>
      <button id="btn-prev-page" class="icon" title="Previous page">‹</button>
      <input id="page-number" type="number" min="1" value="1" aria-label="Page number">
      <span id="page-count">/ 0</span>
      <button id="btn-next-page" class="icon" title="Next page">›</button>
    </div>

    <div class="group" data-needs-doc>
      <button id="btn-zoom-out" class="icon" title="Zoom out (⌘−)">−</button>
      <select id="zoom-select" aria-label="Zoom">
        <option value="page-width">Fit Width</option>
        <option value="page-fit">Fit Page</option>
        <option value="0.25">25%</option>
        <option value="0.5">50%</option>
        <option value="0.75">75%</option>
        <option value="1">100%</option>
        <option value="1.5">150%</option>
        <option value="2">200%</option>
        <option value="4">400%</option>
        <option value="8">800%</option>
        <option value="custom" hidden></option>
      </select>
      <button id="btn-zoom-in" class="icon" title="Zoom in (⌘=)">+</button>
    </div>

    <div class="group spacer"></div>

    <div class="group" data-needs-doc>
      <button id="btn-find" title="Find (⌘F)">Find</button>
    </div>
  </header>

  <nav id="tabbar" aria-label="Open documents"></nav>

  <div id="propbar" hidden>
    <span id="prop-title"></span>
    <label data-prop="stamp">Stamp <select id="prop-stamp"></select></label>
    <label data-prop="scale">Scale <select id="prop-scale"></select></label>
    <label data-prop="scale"><input id="prop-scale-all" type="checkbox"> All pages</label>
    <label data-prop="color">Color <input id="prop-color" type="color"></label>
    <label data-prop="fill"><input id="prop-fill-on" type="checkbox"> Fill <input id="prop-fill" type="color"></label>
    <label data-prop="width">Line
      <select id="prop-width">
        <option value="0">None</option>
        <option value="0.5">0.5 pt</option>
        <option value="1">1 pt</option>
        <option value="1.5">1.5 pt</option>
        <option value="2">2 pt</option>
        <option value="3">3 pt</option>
        <option value="4">4 pt</option>
        <option value="6">6 pt</option>
        <option value="8">8 pt</option>
        <option value="12">12 pt</option>
        <option value="14">14 pt</option>
        <option value="18">18 pt</option>
        <option value="24">24 pt</option>
      </select>
    </label>
    <label data-prop="fontSize">Text
      <select id="prop-font-size">
        <option>8</option><option>9</option><option>10</option><option>11</option><option>12</option>
        <option>14</option><option>16</option><option>18</option><option>20</option><option>24</option>
        <option>28</option><option>36</option><option>48</option><option>72</option>
      </select>
    </label>
    <label data-prop="opacity">Opacity <input id="prop-opacity" type="range" min="10" max="100" step="5"> <span id="prop-opacity-value"></span></label>
    <button id="prop-delete" title="Delete markup (⌫)">Delete</button>
  </div>

  <div id="findbar" hidden>
    <input id="find-input" type="search" placeholder="Find in document" aria-label="Find in document">
    <button id="find-prev" class="icon" title="Previous match (⇧Enter)">↑</button>
    <button id="find-next" class="icon" title="Next match (Enter)">↓</button>
    <label><input id="find-case" type="checkbox"> Match case</label>
    <label><input id="find-word" type="checkbox"> Whole words</label>
    <span id="find-status"></span>
    <button id="find-close" class="icon" title="Close (Esc)">✕</button>
  </div>

  <main id="workspace">
    <aside id="sidebar"></aside>
    <section id="main-col">
    <section id="viewers">
      <div id="welcome">
        <div class="welcome-card">
          <h1>Redline PDF Editor</h1>
          <p>Open a PDF, or drag one onto this window.</p>
          <button id="btn-open-welcome">Open PDF…</button>
        </div>
      </div>
    </section>
    <section id="markups-panel" hidden>
      <div class="panel-header">
        <strong id="ml-title">Markups</strong>
        <select id="ml-type" aria-label="Filter by type"></select>
        <label><input id="ml-page-only" type="checkbox"> This page only</label>
        <input id="ml-search" type="search" placeholder="Search" aria-label="Search markups">
        <span class="spacer"></span>
        <button id="ml-export">Export CSV…</button>
        <button id="ml-close" class="icon" title="Close (⌘L)">✕</button>
      </div>
      <div class="panel-body">
        <table id="ml-table">
          <thead><tr></tr></thead>
          <tbody></tbody>
        </table>
        <p id="ml-empty">No markups yet.</p>
      </div>
      <div id="ml-totals"></div>
    </section>
    </section>
  </main>

  <dialog id="calibrate-dialog">
    <form method="dialog">
      <h2>Calibrate scale</h2>
      <p>The line you drew is <strong id="cal-sheet"></strong> long on the sheet. How long is it in reality?</p>
      <div class="cal-row">
        <input id="cal-length" type="text" inputmode="decimal" autocomplete="off" placeholder="e.g. 20 or 12'6&quot;">
        <select id="cal-unit">
          <option value="ft">feet</option>
          <option value="in">inches</option>
          <option value="m">meters</option>
          <option value="cm">centimeters</option>
          <option value="mm">millimeters</option>
        </select>
      </div>
      <label><input id="cal-all" type="checkbox" checked> Use this scale on all pages</label>
      <p id="cal-error" role="alert"></p>
      <div class="dialog-buttons">
        <button value="cancel" formnovalidate>Cancel</button>
        <button value="ok" class="primary">Set Scale</button>
      </div>
    </form>
  </dialog>

  <footer id="statusbar">
    <span id="status-file"></span>
    <span id="status-scale"></span>
    <button id="btn-markups-list" class="status-button" title="Markups List (⌘L)">Markups List</button>
    <span id="status-size"></span>
  </footer>

  <script type="module" src="app.js"></script>
</body>
</html>
