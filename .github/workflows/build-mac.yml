name: Build Mac app

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # One architecture at a time: both disk images use the same volume name,
      # and building them together makes macOS fail to unmount one of them.
      - name: Build .dmg installers (Intel and Apple silicon)
        run: |
          npx electron-builder --mac --x64 --publish never
          npx electron-builder --mac --arm64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Keep the installers with this run
        uses: actions/upload-artifact@v4
        with:
          name: mac-installers
          path: dist/*.dmg

      - name: Publish as the latest release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Redline PDF Editor (build ${{ github.run_number }})
          body: |
            Mac installers built from ${{ github.sha }}.
            - Apple silicon Macs (M1 and newer): Redline-PDF-Editor-arm64.dmg
            - Intel Macs: Redline-PDF-Editor-x64.dmg
          files: dist/*.dmg
          make_latest: true
